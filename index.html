<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aperture — Surface Command</title>
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("aperture-theme");
        } catch (error) {
          stored = null;
        }
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        var isDark =
          stored === "dark" || (stored !== "light" && prefersDark);
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.style.colorScheme = isDark
          ? "dark"
          : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
