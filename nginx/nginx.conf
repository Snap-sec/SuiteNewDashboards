map $arg_snaptoken$http_snaptoken $snaptoken_check {
    default 1;
    "~^a8sx7as9x87as8x7ahsxas8xasx899asxhiasx$" 0;
}

server {
    # Root directory for the React app
    listen 80 default_server;
    server_name suite.snapsec.co _;
    root /usr/share/nginx/html/;
    client_max_body_size 100M;
    # Use variable for upstream to avoid startup failure if host is not found
    resolver 127.0.0.11 valid=30s;

    # Main location block for the React app
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    location /sample/download/ {
        # Use alias instead of root (make sure the trailing slash is correct)
        alias /app/samples/;

        # Disable directory listing
        autoindex off;

        # Ensure correct MIME types
        include mime.types;
        default_type application/octet-stream;

        # Set content disposition for download
        add_header Content-Disposition "attachment";

        # Security headers
        add_header X-Content-Type-Options "nosniff";
    }

    # Serve static assets
    location /static {
        alias /usr/share/nginx/html/; 
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
    
    # Public files
    location /public {
        alias /usr/share/nginx/html;
    }

    # AIM
    location /aim {
        set $upstream_aim aim;
        proxy_pass http://$upstream_aim;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }


    location /apisec {
        set $upstream_apisec apisec;
        proxy_pass http://$upstream_apisec;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # AIM-Revamp
    location /asset-inventory {
        set $upstream_asset_inventory asset-inventory;
        proxy_pass http://$upstream_asset_inventory;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # AIM
    location /notify {
        set $upstream_notify notify;
        proxy_pass http://$upstream_notify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }


    location /tm {
        set $upstream_tm tm;
        proxy_pass http://$upstream_tm;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /op {
        set $upstream_op op;
        proxy_pass http://$upstream_op;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /vs/api {
        set $upstream_vs vs;
        proxy_pass http://$upstream_vs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Admin with authentication
    location /z4to1w2Ww0tviBr5fAMusiSLHsUKf2GKP3cz4xdTt6fWT05X {
        set $upstream_admin admin;
        proxy_pass http://$upstream_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 10M;
        proxy_read_timeout 90s;
    }

    # VM (CSM)
    location /csm/ {
        set $upstream_vm vm;
        rewrite ^/csm/?(.*) /$1 break;
        proxy_pass http://$upstream_vm;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Auth Service
    location /auth/api/ {
        set $upstream_auth auth;
        rewrite ^/auth/(.*) /$1 break;
        proxy_pass http://$upstream_auth;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }


    # sca Service
    location /sca/ {
        set $upstream_sca sca;
        proxy_pass http://$upstream_sca;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }


    # Util Service
    location /cspm {
        set $upstream_cspm cspm;
        proxy_pass http://$upstream_cspm;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Util Service
    location /util {
        set $upstream_util util;
        proxy_pass http://$upstream_util;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Util Service
    location /automations {
        set $upstream_automations_service automation-service;
        proxy_pass http://$upstream_automations_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
 

    # MCP Service
    location /mcp {
        set $upstream_mcp mcp-service;
        proxy_pass http://$upstream_mcp;
            
        # Required for Server-Sent Events (SSE)
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }


    # sast Service
    location /sast {
        set $upstream_sast_service sast;
        proxy_pass http://$upstream_sast_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }


    # autopt Service
    location /autopentest/ {
        set $upstream_autopt_service auto-pentest;
        proxy_pass http://$upstream_autopt_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # integrations Service
    location /integrations/ {
        set $upstream_integrations integration-service;
        proxy_pass http://$upstream_integrations;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
 

    # Global proxy settings
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffers 8 16k;
    proxy_buffer_size 32k;
}

# Optional Admin Service (may not exist on on-premise environments)
server {
    listen 80;
    server_name admin.snapsec.co;
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_admin admin;
        proxy_pass http://$upstream_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}


# Optional Sales Service (may not exist on on-premise environments)
server {
    listen 80;
    server_name sales.snapsec.co;
